;CFW - valores por defecto de CFW: no lo edites.
;Lo del sitio va en cfw/specific/config.ini y lo de cada servidor en cfw/data/config.ini (ver INSTALACION.md).
;pathbase vale por defecto la raíz del sitio: solo hace falta indicarla si es otra.

[entorno]
desarrollo = false

[general]
charset = utf-8;
urlbase = http://localhost/
name = 'CFW'
email = webmaster@example.com
lang_default = es
description = 'Framework PHP'
keywords = 'framework, php, web'
analytics = 

[base_de_datos]
db.host = localhost
db.user = cfw
db.pass = cfw
db.name = cfw
db.limit = 1000

[App]
class.default = main
page.404 = errorpage

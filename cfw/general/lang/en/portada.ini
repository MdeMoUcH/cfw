page_title = "Home"

titulo = "CFW, an MVC framework in PHP"

intro = "CFW is an MVC framework in PHP that provides a base ready to start from: home page, login, account, user management and languages."

bondades_titulo = "What it offers"

bondad_1 = "Each project is built on top without modifying the base: whatever you put in specific takes priority over general."

bondad_2 = "Clear separation: controllers that extend Page, models that extend Orm and views in .tpl templates."

bondad_3 = "No Composer and no packages to install: the JS libraries are included in the repository."

bondad_4 = "Simple routes: /admin/class/method/arg1/arg2."

bondad_5 = "Optional multi-language support: Spanish and English included, management at /admin/idiomas, language choice per user and Accept-Language detection for visitors."

bondad_6 = "Included measures: CSRF token on POST requests; by URL, only the page's public methods, not those of App or Page; HttpOnly and SameSite=Lax session cookie; and session id regenerated on login and logout."

requisitos = "Requirements: PHP 8.2 or higher (tested from 8.2 to 8.5), Apache with mod_rewrite and .htaccess enabled, MySQL 5.7 and the mysqli and openssl extensions. In production, HTTPS."

aviso = "Passwords are stored with password_hash and travel encrypted with RSA, but HTTPS is still required: that encryption does not protect against someone modifying the JavaScript in transit or prevent theft of the session cookie, and the framework does not force HTTPS. It does not escape output in templates either. More details in the README."

enlace_repo = "View the repository on GitHub"

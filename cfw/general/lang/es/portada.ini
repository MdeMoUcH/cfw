page_title = "Portada"

titulo = "CFW, framework MVC en PHP"

intro = "CFW es un framework MVC en PHP que da una base lista para empezar: portada, login, cuenta, gestión de usuarios e idiomas."

bondades_titulo = "Qué ofrece"

bondad_1 = "Cada proyecto se construye encima sin modificar la base: lo que pongas en specific tiene prioridad sobre general."

bondad_2 = "Separación clara: controladores que heredan de Page, modelos que heredan de Orm y vistas en plantillas .tpl."

bondad_3 = "Sin Composer ni paquetes que instalar: las librerías JS van incluidas en el repositorio."

bondad_4 = "Rutas sencillas: /admin/clase/metodo/arg1/arg2."

bondad_5 = "Multiidioma opcional: español e inglés incluidos, gestión en /admin/idiomas, elección de idioma por usuario y detección de Accept-Language para los visitantes."

bondad_6 = "Medidas incluidas: token CSRF en los POST; por URL, solo los métodos públicos de la página, no los de App ni Page; cookie de sesión HttpOnly y SameSite=Lax; e id de sesión regenerado al entrar y al salir."

requisitos = "Requisitos: PHP 8.2 o superior (probado de 8.2 a 8.5), Apache con mod_rewrite y .htaccess activo, MySQL 5.7 y las extensiones mysqli y openssl. En producción, HTTPS."

aviso = "Hecho por MdeMoUcH"

enlace_repo = "Ver el repositorio en GitHub"

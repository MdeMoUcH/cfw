;CFW - configuración del sitio: la edita el sitio y se versiona.
;Lo de cada servidor y lo secreto (urlbase, db.*, desarrollo...) va en config/config-servidor.ini, que pisa a este clave a clave (ver INSTALACION.md).
;Al actualizar CFW, añade aquí las claves nuevas que liste MIGRACION.md.

[entorno]
desarrollo = false

[general]
charset = utf-8
name = 'CFW'
email = webmaster@example.com
lang_default = es
description = 'Framework PHP'
keywords = 'framework, php, web'
analytics = 
;En config/config-servidor.ini:
;urlbase = http://localhost/
;pathbase vale por defecto la raíz del sitio: solo hace falta indicarla si es otra.
;pathbase = /var/www/sitio/
;intentos.carpeta = /ruta/absoluta/intentos
;cifrado.clave_privada = /ruta/absoluta/clave_privada.pem

[base_de_datos]
db.limit = 1000
;En config/config-servidor.ini:
;db.host = localhost
;db.user = usuario
;db.pass = contraseña
;db.name = base_de_datos

[App]
class.default = main
